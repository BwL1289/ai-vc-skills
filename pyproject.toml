# Settings for the whole repository. The calculator's own package settings are in equity_calculator/pyproject.toml.

[dependency-groups]
# The tools for working on the repository: `pip install --group dev` (pip 25.1 or later).
# ruff matches the ruff-pre-commit rev in .pre-commit-config.yaml.
dev = ["pre-commit", "pytest-cov", "ruff==0.1.13"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 120
# equity_calculator/ sits at the root, so isort would call its imports first-party; the package's own ruff
# settings (equity_calculator/pyproject.toml) place them as third-party, and the two hooks must agree.
known_third_party = ["equity_calculator", "tests"]

[tool.pytest.ini_options]
testpaths = ["equity_calculator/tests"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = ["tests/fixtures", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = [
    "--strict-markers",
    "--doctest-modules",
    "--cov",
    "--cov-append",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=0",
    "--cov-config=pyproject.toml",
]

[tool.coverage.run]
branch = true
concurrency = ["thread", "multiprocessing"]
parallel = true
source_pkgs = ["equity_calculator"]

[tool.coverage.report]
show_missing = true
fail_under = 75
precision = 2
