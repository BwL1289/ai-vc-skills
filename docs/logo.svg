<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ai-vc-logo-title">
  <title id="ai-vc-logo-title">AI VC skills</title>
  <defs>
    <style>
      .shadow { flood-color: #371307; flood-opacity: 0.22; }
