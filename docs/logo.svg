        .shadow { flood-color: #000000; flood-opacity: 0.55; }
        .hl-top { stop-opacity: 0.22; }
      }
    </style>
    <mask id="knight-cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g stroke="#000" stroke-width="16" stroke-linecap="round">
        <path d="M280 240 L171 69"/>
        <path d="M280 240 L314 63"/>
        <path d="M280 240 L470 240"/>
      </g>
      <circle cx="280" cy="240" r="25" fill="#000"/>
    </mask>
    <linearGradient id="knight-shade-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fd8f32"/><stop offset="1" stop-color="#fd780a"/></linearGradient>
    <linearGradient id="knight-shade-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3691f"/><stop offset="1" stop-color="#de550b"/></linearGradient>
    <linearGradient id="knight-shade-3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6510f"/><stop offset="1" stop-color="#bf440c"/></linearGradient>
    <linearGradient id="knight-shade-4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5420e"/><stop offset="1" stop-color="#9e350b"/></linearGradient>
    <linearGradient id="knight-shade-base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aa3c14"/><stop offset="1" stop-color="#862f10"/></linearGradient>
    <linearGradient id="knight-edge-head" gradientUnits="userSpaceOnUse" x1="0" y1="24" x2="0" y2="474"><stop offset="0" stop-color="#fff" stop-opacity="0.35" class="hl-top"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="knight-clip-head"><path d="M106 230 Q70 228 66 200 L64 184 Q62 160 86 152 L196 108 L234 98 L258 24 L306 104 A138 138 0 0 1 418 240 A138 138 0 0 1 410 286 Q400 328 398 374 L174 374 Q160 340 214 300 L280 240 Z"/></clipPath>
