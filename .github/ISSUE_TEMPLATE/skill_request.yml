name: Skill request
description: A question a founder asks that a skill should answer
labels: ["enhancement"]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: What a founder asks, in their own words. Every skill here works for the founder; an investor's view can be a lens in a review, never the user.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: A worked example
      description: Inputs and the answer you would expect, if you have one.
  - type: textarea
    id: source
    attributes:
      label: The source you would trust
      description: An essay, a standard form, a textbook, a firm's public guide.
